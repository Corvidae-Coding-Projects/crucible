changelog:
  exclude:
    labels:
      - "skip changelog"
  categories:
    - title: Breaking changes
      labels:
        - breaking change
    - title: Verification and trusted boundaries
      labels:
        - "area: verification"
    - title: Features and capabilities
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation and governance
      labels:
        - documentation
        - governance
    - title: Other changes
      labels:
        - "*"
